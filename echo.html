<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Tokio Echo Server — live animation</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --line:#30363d;
    --listener:#ffd43b; --task:#4dabf7; --pend:#ffa94d;
    --ok:#51cf66; --client:#9775fa; --read:#4dabf7;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:#e6edf3;
       font:13px/1.5 ui-monospace,"SF Mono",Menlo,monospace;padding:20px}
  h1{font-size:15px;letter-spacing:.4px;color:#7d8590;font-weight:400;margin:0 0 12px}
  button{background:#238636;border:0;color:#fff;padding:8px 16px;border-radius:8px;
         font:inherit;cursor:pointer;margin-bottom:14px}
  button:disabled{opacity:.4;cursor:default}
  #stage{position:relative;background:var(--panel);border:1px solid var(--line);
         border-radius:14px;padding:20px;min-height:460px;overflow:hidden}

  #listener{display:inline-block;border:2px solid var(--listener);color:var(--listener);
            border-radius:10px;padding:10px 14px;margin-bottom:18px;transition:.3s;
            background:#0d1117}
  #listener .label{font-weight:700;font-size:12px}
  #listener .sub{font-size:11px;color:#7d8590;margin-top:3px}
  #listener.active{box-shadow:0 0 0 3px rgba(255,212,59,.15),0 0 22px -4px var(--listener);
                   transform:translateY(-2px)}

  #tasks{display:flex;gap:14px;flex-wrap:wrap}
  .task{border:2px solid var(--task);border-radius:12px;padding:12px;
        background:#0d1117;width:245px;opacity:0;transform:translateY(8px);
        transition:opacity .4s,transform .4s,border-color .4s,box-shadow .3s}
  .task.in{opacity:1;transform:translateY(0)}
  .task.done{border-color:var(--ok)}
  .task .head{display:flex;justify-content:space-between;font-size:11px;
              color:#7d8590;margin-bottom:8px}
  .task .head b{color:var(--task)}
  .task.done .head b{color:var(--ok)}
  .status{font-size:11px;padding:3px 7px;border-radius:6px;background:#21262d;
          color:#7d8590;display:inline-block;margin-bottom:8px;transition:.3s}
  .status.pend{background:#3d2a00;color:var(--pend)}
  .status.ok{background:#0f2e1a;color:var(--ok)}

  .buf{display:flex;gap:3px;margin:8px 0}
  .slot{flex:1;height:24px;border:1px solid var(--line);border-radius:4px;
        background:#010409;transition:.25s;display:flex;align-items:center;
        justify-content:center;font-size:9px;color:#484f58}
  .slot.data{background:#1f6feb55;border-color:var(--read);color:#e6edf3;
             transform:scale(1.05)}

  .code{font-size:10px;color:#7d8590;line-height:1.7}
  .code .kw{color:#ff7b72}
  .code .fn{color:#d2a8ff}
  .code .vr{color:#79c0ff}

  .dot{position:absolute;padding:3px 8px;border-radius:999px;font-size:10px;
       font-weight:700;color:#000;white-space:nowrap;pointer-events:none;z-index:99;
       transform:translate(0,0) scale(.6);opacity:0;
       transition:transform .9s cubic-bezier(.34,1.3,.64,1),opacity .25s}
  .dot.go{opacity:1;transform:translate(var(--dx),var(--dy)) scale(1)}

  #log{margin-top:14px;background:#010409;border:1px solid var(--line);
       border-radius:10px;padding:10px;height:160px;overflow:auto;font-size:11px}
  #log div{padding:1px 0;border-bottom:1px solid #161b22;animation:in .3s}
  @keyframes in{from{opacity:0;transform:translateX(-6px)}}
  .l-ls{color:var(--listener)} .l-tk{color:var(--task)} .l-pend{color:var(--pend)}
  .l-ok{color:var(--ok)} .l-cl{color:var(--client)} .l-dim{color:#7d8590}
</style>
</head>
<body>
<h1>tokio TcpListener + spawn + read + write_all — live animation</h1>
<button id="play">▶ Play</button>
<div id="stage">
  <div id="listener">
    <div class="label">🎧 TcpListener · 127.0.0.1:8080</div>
    <div class="sub">listener.accept().await → tokio::spawn(…)</div>
  </div>
  <div id="tasks"></div>
</div>
<div id="log"></div>

<script>
const $ = s => document.querySelector(s);
const stage = $('#stage'), tasksEl = $('#tasks'), logEl = $('#log');

function log(m, c='') {
  const d = document.createElement('div');
  d.className = c; d.textContent = m;
  logEl.appendChild(d); logEl.scrollTop = logEl.scrollHeight;
}
const wait = ms => new Promise(r => setTimeout(r, ms));

function makeTask(id) {
  const t = document.createElement('div');
  t.className = 'task'; t.id = 'task' + id;
  t.innerHTML = `
    <div class="head"><b>🟦 TASK ${id}</b><span>spawned</span></div>
    <div class="status" id="st${id}">⏸ idle</div>
    <div class="buf" id="buf${id}">
      ${Array.from({length:8},(_,i)=>
        `<div class="slot" id="s${id}_${i}">0</div>`).join('')}
    </div>
    <div class="code">
      <span class="kw">let mut</span> <span class="vr">buf</span> = [0; 1024];<br>
      <span class="kw">match</span> <span class="vr">socket</span>.<span class="fn">read</span>(&amp;mut buf).<span class="kw">await</span> {<br>
      &nbsp;&nbsp;<span class="fn">Ok</span>(n) =&gt; socket.<span class="fn">write_all</span>(&amp;buf[0..n]).<span class="kw">await</span><br>
      }
    </div>`;
  tasksEl.appendChild(t);
  return t;
}

function fly(fromEl, toEl, text, color, dur=450) {
  return new Promise(res => {
    const a = fromEl.getBoundingClientRect(),
          b = toEl.getBoundingClientRect(),
          s = stage.getBoundingClientRect();
    const d = document.createElement('div');
    d.className = 'dot'; d.textContent = text; d.style.background = color;
    d.style.left = (a.left - s.left + a.width/2) + 'px';
    d.style.top  = (a.top  - s.top  + a.height/2) + 'px';
    d.style.setProperty('--dx', (b.left - a.left) + 'px');
    d.style.setProperty('--dy', (b.top  - a.top ) + 'px');
    d.style.transitionDuration = dur + 'ms';
    stage.appendChild(d);
    requestAnimationFrame(() => requestAnimationFrame(() => d.classList.add('go')));
    setTimeout(() => { d.remove(); res(); }, dur + 60);
  });
}

function setStatus(id, text, cls='') {
  const el = $('#st' + id);
  el.textContent = text;
  el.className = 'status ' + cls;
}

async function run() {
  $('#play').disabled = true;
  tasksEl.innerHTML = ''; logEl.innerHTML = '';

  log('🎧 listener = TcpListener::bind("127.0.0.1:8080").await', 'l-ls');
  log('   entering: while let Ok((socket,_)) = listener.accept().await', 'l-dim');
  await wait(700);

  const clients = [
    { id:1, msg:'hi',    bytes:2, color:'#9775fa' },
    { id:2, msg:'hello', bytes:5, color:'#63e6be' },
    { id:3, msg:'ping!', bytes:5, color:'#ffa94d' },
  ];

  for (const c of clients) {
    log(`🔌 client ${c.id} connects`, 'l-cl');
    $('#listener').classList.add('active');
    await wait(350);

    log(`   accept() → Ok((socket, addr))`, 'l-ls');
    const task = makeTask(c.id);
    await wait(40);
    task.classList.add('in');
    log(`   tokio::spawn(async move { … }) → 🟦 task ${c.id}`, 'l-tk');
    $('#listener').classList.remove('active');
    await wait(450);

    log(`   task ${c.id}: let mut buf = [0; 1024];  📦 1 KB zeroed`, 'l-dim');
    await wait(350);

    setStatus(c.id, '⏳ read().await — Pending', 'pend');
    log(`   task ${c.id}: socket.read(&mut buf).await → Poll::Pending 🛑`, 'l-pend');
    log(`   task ${c.id}: waker registered · thread freed 💤`, 'l-dim');
    await wait(700);

    log(`   🌐 client ${c.id} → sends ${c.bytes} bytes: "${c.msg}"`, 'l-cl');
    for (let i = 0; i < c.bytes; i++) {
      await fly($('#listener'), task, 'byte', c.color, 320);
      const slot = $(`#s${c.id}_${i}`);
      if (slot) { slot.classList.add('data'); slot.textContent = '·'; }
    }
    await wait(250);

    log(`   🔔 reactor: fd readable → waker.wake()`, 'l-pend');
    setStatus(c.id, `✅ read → Ok(${c.bytes})`, 'ok');
    log(`   task ${c.id}: read returned Ok(n) — n = ${c.bytes}`, 'l-ok');
    await wait(500);

    setStatus(c.id, `↩ write_all(&buf[0..${c.bytes}])`, 'ok');
    log(`   task ${c.id}: socket.write_all(&buf[0..${c.bytes}]).await`, 'l-ok');
    for (let i = 0; i < c.bytes; i++) {
      const slot = $(`#s${c.id}_${i}`);
      if (slot) await fly(slot, $('#listener'), 'echo', '#51cf66', 300);
    }
    log(`   ➡ client ${c.id} received "${c.msg}"`, 'l-ok');

    task.classList.add('done');
    setStatus(c.id, '✔ task complete', 'ok');
    task.querySelector('.head span').textContent = 'done';
    await wait(700);
  }

  log('🎧 back to accept().await — waiting for next connection', 'l-dim');
  log('✅ demo complete', 'l-ok');
  $('#play').disabled = false;
}

$('#play').addEventListener('click', run);
</script>
</body>
</html>
