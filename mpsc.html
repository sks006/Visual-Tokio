<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>tokio::sync::mpsc — animation</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --line:#30363d;
    --t1:#4dabf7; --t2:#9775fa; --main:#ffd43b; --ok:#51cf66; --pend:#ffa94d;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:#e6edf3;
       font:14px/1.5 ui-monospace,"SF Mono",Menlo,monospace;padding:24px}
  h1{font-size:16px;letter-spacing:.5px;color:#7d8590;font-weight:400;margin:0 0 16px}
  #stage{position:relative;background:var(--panel);border:1px solid var(--line);
         border-radius:14px;padding:22px;min-height:420px;overflow:hidden}
  .row{display:flex;gap:16px;align-items:flex-start;justify-content:space-between}
  .col{display:flex;flex-direction:column;gap:12px;flex:1}

  .box{border:2px solid;border-radius:10px;padding:10px 12px;background:#0d1117;
       transition:.35s;position:relative}
  .box .label{font-weight:700;font-size:12px;letter-spacing:.4px}
  .box .sub{font-size:11px;color:#7d8590;margin-top:4px}
  .t1{border-color:var(--t1);color:var(--t1)}
  .t2{border-color:var(--t2);color:var(--t2)}
  .mn{border-color:var(--main);color:var(--main)}
  .dim{opacity:.3;filter:grayscale(.6)}
  .active{box-shadow:0 0 0 3px rgba(255,255,255,.10),0 0 22px -4px currentColor;transform:translateY(-2px)}

  #chan{flex:1.3;border:2px dashed #7d8590;border-radius:12px;padding:12px;background:#0d1117}
  #chan h3{margin:0 0 8px;font-size:12px;color:#7d8590;font-weight:600}
  #permits{font-size:12px;color:var(--pend);margin-bottom:10px}
  #slots{display:flex;gap:6px;flex-wrap:wrap}
  .slot{width:30px;height:34px;border:1px solid var(--line);border-radius:6px;
        display:flex;align-items:center;justify-content:center;font-size:10px;
        color:#484f58;background:#010409;transition:.3s}
  .slot.filled{background:#1f6feb33;border-color:var(--t1);color:#e6edf3}

  .dot{position:absolute;padding:3px 8px;border-radius:999px;font-size:10px;font-weight:700;
       color:#000;white-space:nowrap;pointer-events:none;z-index:99;
       transform:translate(0,0) scale(.6);opacity:0;
       transition:transform .8s cubic-bezier(.34,1.3,.64,1),opacity .25s}
  .dot.go{opacity:1;transform:translate(var(--dx),var(--dy)) scale(1)}

  #log{margin-top:16px;background:#010409;border:1px solid var(--line);border-radius:10px;
       padding:12px;height:170px;overflow:auto;font-size:12px}
  #log div{padding:2px 0;border-bottom:1px solid #161b22;animation:in .3s}
  @keyframes in{from{opacity:0;transform:translateX(-6px)}}
  .l-t1{color:var(--t1)} .l-t2{color:var(--t2)} .l-mn{color:var(--main)}
  .l-ok{color:var(--ok)} .l-pend{color:var(--pend)}
  button{background:#238636;border:0;color:#fff;padding:9px 18px;border-radius:8px;
         font:inherit;cursor:pointer;margin-bottom:14px}
  button:disabled{opacity:.4;cursor:default}
</style>
</head>
<body>
<h1>tokio::sync::mpsc::channel(32) — live animation</h1>
<button id="play">▶ Play</button>

<div id="stage">
  <div class="row">
    <div class="col">
      <div class="box t1" id="task1"><div class="label">🟦 TASK 1</div><div class="sub">tx1.send("Hello from Task 1!").await</div></div>
      <div class="box t2" id="task2"><div class="label">🟪 TASK 2</div><div class="sub">tx2.send("Hello from Task 2!").await</div></div>
      <div class="box mn" id="main"><div class="label">🧠 MAIN</div><div class="sub" id="mainSub">rx.recv().await</div></div>
    </div>

    <div id="chan">
      <h3>📬 CHANNEL · cap 32</h3>
      <div id="permits">🎟️ permits: 32 · tx_refs: 1</div>
      <div id="slots"></div>
    </div>
  </div>
</div>

<div id="log"></div>

<script>
const $ = s => document.querySelector(s);
const logEl = $('#log');
const slotsEl = $('#slots');
const stage = $('#stage');
const SLOTS = 8;

function log(msg, cls='') {
  const d = document.createElement('div');
  d.className = cls; d.textContent = msg;
  logEl.appendChild(d); logEl.scrollTop = logEl.scrollHeight;
}
function setPermits(p, refs) {
  $('#permits').textContent = `🎟️ permits: ${p} · tx_refs: ${refs}`;
}
function mark(el, on=true){ el.classList.toggle('active', on); }

for (let i=0;i<SLOTS;i++){
  const s=document.createElement('div'); s.className='slot'; s.id='slot'+i; s.textContent=i;
  slotsEl.appendChild(s);
}

const wait = ms => new Promise(r=>setTimeout(r,ms));

function fly(fromEl, toEl, text, color){
  return new Promise(res=>{
    const a=fromEl.getBoundingClientRect(), b=toEl.getBoundingClientRect(),
          s=stage.getBoundingClientRect();
    const dot=document.createElement('div');
    dot.className='dot'; dot.textContent=text; dot.style.background=color;
    dot.style.left=(a.left-s.left+a.width/2)+'px';
    dot.style.top =(a.top -s.top +a.height/2)+'px';
    dot.style.setProperty('--dx', (b.left-a.left)+'px');
    dot.style.setProperty('--dy', (b.top -a.top )+'px');
    stage.appendChild(dot);
    requestAnimationFrame(()=>requestAnimationFrame(()=>dot.classList.add('go')));
    setTimeout(()=>{dot.remove();res();}, 850);
  });
}

async function run(){
  $('#play').disabled = true;
  logEl.innerHTML=''; slotsEl.querySelectorAll('.slot').forEach(s=>s.classList.remove('filled'));
  $('#task1').classList.add('dim'); $('#task2').classList.add('dim');
  let permits=32, refs=1, buffered=0;

  log('⚙️ PHASE 1 — setup');
  await wait(400);
  log('   mpsc::channel(32) → (tx, rx)');
  setPermits(permits, refs); await wait(500);

  log('   tx1 = tx.clone()   → tx_refs = 2', 'l-mn'); refs=2; setPermits(permits,refs); await wait(350);
  log('   tokio::spawn(Task 1) 🚀', 'l-t1');
  $('#task1').classList.remove('dim'); mark($('#task1')); await wait(450);

  log('   tx2 = tx.clone()   → tx_refs = 3', 'l-mn'); refs=3; setPermits(permits,refs); await wait(350);
  log('   tokio::spawn(Task 2) 🚀', 'l-t2');
  $('#task2').classList.remove('dim'); mark($('#task2')); await wait(450);

  log('   drop(tx)           → tx_refs = 2  🔑', 'l-mn'); refs=2; setPermits(permits,refs); await wait(450);

  mark($('#task1'),false); mark($('#task2'),false);
  log('😴 PHASE 2 — main calls rx.recv().await', 'l-mn');
  mark($('#main'));
  await wait(500);
  log('   buffer EMPTY, but tx_refs = 2 → Poll::Pending 🛑', 'l-pend');
  $('#mainSub').textContent = '💤 PARKED (Poll::Pending)'; await wait(800);

  log('🏃 PHASE 3 — senders run (possibly on other threads)');
  mark($('#task1'));
  log('   Task 1: tx1.send(..).await', 'l-t1');
  await fly($('#task1'), $('#slot0'), 'msg 1', '#4dabf7');
  $('#slot0').classList.add('filled'); $('#slot0').textContent='1';
  permits--; refs--; buffered++; setPermits(permits,refs);
  log('   permits 32→31 · buffer 0→1 · Ready ✅', 'l-ok');
  log('   🔔 waker.wake() → main requeued', 'l-pend');
  mark($('#task1'),false);
  $('#task1').classList.add('dim');
  $('#task1 .sub').textContent = '✔ done — tx1 dropped';
  await wait(500);

  mark($('#task2'));
  log('   Task 2: tx2.send(..).await', 'l-t2');
  await fly($('#task2'), $('#slot1'), 'msg 2', '#9775fa');
  $('#slot1').classList.add('filled'); $('#slot1').textContent='2';
  permits--; refs--; buffered++; setPermits(permits,refs);
  log('   permits 31→30 · buffer 1→2 · Ready ✅', 'l-ok');
  log('   🔔 waker.wake() → main requeued', 'l-pend');
  mark($('#task2'),false);
  $('#task2').classList.add('dim');
  $('#task2 .sub').textContent = '✔ done — tx2 dropped';
  await wait(600);

  log('🖨️ PHASE 4 — drain the buffer');
  mark($('#main'));
  await fly($('#slot0'), $('#main'), 'msg 1', '#4dabf7');
  $('#slot0').classList.remove('filled'); $('#slot0').textContent='0';
  permits++; buffered--; setPermits(permits,refs);
  log('   Received: Hello from Task 1!', 'l-ok');
  await wait(500);

  await fly($('#slot1'), $('#main'), 'msg 2', '#9775fa');
  $('#slot1').classList.remove('filled'); $('#slot1').textContent='1';
  permits++; buffered--; setPermits(permits,refs);
  log('   Received: Hello from Task 2!', 'l-ok');
  await wait(600);

  log('🏁 PHASE 5 — termination check');
  log('   buffer EMPTY  AND  tx_refs == 0', 'l-pend');
  $('#mainSub').textContent = 'recv() → None';
  await wait(700);
  log('   while let Some(m) exits the loop');
  log('✅ All done!', 'l-ok');
  mark($('#main'),false);
  $('#main').classList.add('dim');
  $('#play').disabled = false;
}
$('#play').addEventListener('click', run);
</script>
</body>
</html>
