<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resilient TcpListener Accept Loop — Connection Lifecycle</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --line: #30363d;
      --text: #e6edf3;
      --text-muted: #7d8590;
      --ls: #ffd43b;
      --pend: #ffa94d;
      --ok: #51cf66;
      --err: #ff6b6b;
      --sock: #4dabf7;
      --client: #9775fa;
      --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 1.6;
      padding: 24px;
      max-width: 900px;
      margin: 0 auto;
    }

    /* NAVIGATION */
    .nav-bar {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 16px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-link {
      color: #58a6ff;
      text-decoration: none;
      font-weight: 600;
      font-size: 13px;
    }

    .nav-link:hover { text-decoration: underline; }

    .nav-badge {
      font-size: 11px;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.05);
      padding: 2px 8px;
      border-radius: 6px;
      border: 1px solid var(--line);
    }

    h1 {
      font-size: 16px;
      color: var(--text);
      font-weight: 600;
      margin-bottom: 14px;
    }

    .controls-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    button {
      background: #238636;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      padding: 8px 16px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }

    button:hover:not(:disabled) { background: #2ea043; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    button.btn-secondary {
      background: #21262d;
      border-color: var(--line);
      color: var(--text);
    }

    label {
      font-size: 12px;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #stage {
      position: relative;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 22px;
      min-height: 420px;
      overflow: hidden;
    }

    .row { display: flex; gap: 18px; align-items: flex-start; }
    .col { display: flex; flex-direction: column; gap: 12px; }

    #listener {
      border: 2px solid var(--ls);
      color: var(--ls);
      border-radius: 12px;
      padding: 14px;
      background: #0d1117;
      width: 240px;
      transition: all 0.35s;
    }

    #listener.active {
      box-shadow: 0 0 0 3px rgba(255, 212, 59, 0.15), 0 0 24px -4px var(--ls);
      transform: translateY(-2px);
    }

    #listener.dead {
      border-color: var(--err);
      color: var(--err);
      opacity: 0.45;
    }

    #status {
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 6px;
      background: #21262d;
      color: var(--text-muted);
      display: inline-block;
      margin-top: 10px;
    }

    #status.pend { background: #3d2a00; color: var(--pend); }
    #status.ok { background: #0f2e1a; color: var(--ok); }
    #status.err { background: #3d0f0f; color: var(--err); }

    #pool { display: flex; flex-direction: column; gap: 8px; flex: 1; }

    .task {
      border: 2px solid var(--sock);
      border-radius: 10px;
      padding: 10px 12px;
      background: #0d1117;
      opacity: 0;
      transform: translateX(10px);
      transition: all 0.35s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
    }

    .task.in { opacity: 1; transform: translateX(0); }
    .task b { color: var(--sock); }

    #clients { display: flex; flex-direction: column; gap: 8px; width: 140px; }

    .cli {
      border: 2px dashed var(--client);
      color: var(--client);
      border-radius: 8px;
      padding: 7px 9px;
      font-size: 11px;
      text-align: center;
      opacity: 0.35;
      transition: all 0.3s;
    }

    .cli.active {
      opacity: 1;
      background: rgba(151, 117, 250, 0.15);
      box-shadow: 0 0 16px -4px var(--client);
    }

    .dot {
      position: absolute;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 700;
      color: #000;
      pointer-events: none;
      z-index: 99;
      opacity: 0;
      transform: scale(0.6);
      transition: transform 0.7s cubic-bezier(0.34, 1.3, 0.64, 1), opacity 0.2s;
    }

    .dot.go {
      opacity: 1;
      transform: translate(var(--dx), var(--dy)) scale(1);
    }

    #log {
      margin-top: 16px;
      background: #010409;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px;
      height: 160px;
      overflow-y: auto;
      font-size: 11px;
    }

    #log div {
      padding: 2px 0;
      border-bottom: 1px solid #161b22;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateX(-6px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .l-ls { color: var(--ls); }
    .l-pend { color: var(--pend); }
    .l-ok { color: var(--ok); }
    .l-err { color: var(--err); }
    .l-cl { color: var(--client); }
    .l-dim { color: var(--text-muted); }
  </style>
</head>
<body>

  <!-- NAVIGATION -->
  <div class="nav-bar">
    <a href="../index.html" class="nav-link">← Back to Tokio Runtime Studio (index.html)</a>
    <span class="nav-badge">Module 04 · Resilient Accept Loop</span>
  </div>

  <!-- TITLE & CONTROLS -->
  <h1>while let Ok((mut socket, _addr)) = listener.accept().await</h1>
  <div class="controls-row">
    <button id="play">▶ Run Accept Loop</button>
    <button class="btn-secondary" onclick="location.reload()">🔄 Reset</button>
    <label>
      <input type="checkbox" id="simErr"> 
      Simulate transient error (ECONNABORTED)
    </label>
  </div>

  <!-- STAGE -->
  <div id="stage">
    <div class="row">
      <div class="col">
        <div id="listener">
          <div style="font-weight:700;">🎧 TcpListener · :8080</div>
          <div style="font-size:10px; color:var(--text-muted); margin-top:4px;">accept(&amp;self) -> io::Result&lt;(TcpStream, SocketAddr)&gt;</div>
          <div id="status">⏸ Idle</div>
        </div>
      </div>
      <div class="col" id="clients"></div>
      <div id="pool"></div>
    </div>
  </div>

  <!-- TELEMETRY LOG -->
  <div id="log"></div>

  <script>
    const $ = s => document.querySelector(s);
    const stage = $('#stage'), logEl = $('#log');
    const wait = ms => new Promise(r => setTimeout(r, ms));

    function log(m, c = '') {
      const d = document.createElement('div');
      d.className = c;
      d.textContent = m;
      logEl.appendChild(d);
      logEl.scrollTop = logEl.scrollHeight;
    }

    function setStatus(t, c = '') {
      $('#status').textContent = t;
      $('#status').className = c;
    }

    function fly(from, to, text, color) {
      return new Promise(res => {
        const a = from.getBoundingClientRect(), b = to.getBoundingClientRect(), s = stage.getBoundingClientRect();
        const d = document.createElement('div');
        d.className = 'dot';
        d.textContent = text;
        d.style.background = color;
        d.style.left = (a.left - s.left + a.width / 2) + 'px';
        d.style.top = (a.top - s.top + a.height / 2) + 'px';
        d.style.setProperty('--dx', (b.left - a.left) + 'px');
        d.style.setProperty('--dy', (b.top - a.top) + 'px');
        stage.appendChild(d);
        requestAnimationFrame(() => requestAnimationFrame(() => d.classList.add('go')));
        setTimeout(() => { d.remove(); res(); }, 760);
      });
    }

    // Build client elements
    for (let i = 1; i <= 4; i++) {
      const c = document.createElement('div');
      c.className = 'cli';
      c.id = 'cli' + i;
      c.textContent = '🌐 client ' + i;
      $('#clients').appendChild(c);
    }

    async function run() {
      $('#play').disabled = true;
      $('#pool').innerHTML = '';
      logEl.innerHTML = '';
      $('#listener').classList.remove('dead');
      document.querySelectorAll('.cli').forEach(c => c.classList.remove('active'));
      setStatus('⏸ Idle');
      await wait(300);

      log('listener = TcpListener::bind("127.0.0.1:8080").await', 'l-ls');
      log('entering: while let Ok((mut socket, _addr)) = listener.accept().await', 'l-dim');
      await wait(500);

      const simErr = $('#simErr').checked;

      for (let i = 1; i <= 4; i++) {
        $('#cli' + i).classList.add('active');
        log(`🔌 client ${i} connects → SYN packet queued in listen backlog`, 'l-cl');
        await wait(350);

        $('#listener').classList.add('active');
        setStatus('⏳ accept().await → Pending 🛑', 'pend');
        log('   accept() future → Poll::Pending · waker registered', 'l-pend');
        await wait(550);

        log('   🔔 reactor: listen fd readable → waker.wake()', 'l-pend');
        setStatus('🔄 re-polled → accept4()', 'pend');
        await wait(400);

        if (simErr && i === 3) {
          setStatus('❌ Ok(..) failed to match', 'err');
          log('   accept() → Poll::Ready(Err(ECONNABORTED))', 'l-err');
          log('   naive pattern `while let Ok(...)` EXITED ON TRANSIENT ERROR!', 'l-err');
          await wait(600);
          $('#listener').classList.remove('active');
          $('#listener').classList.add('dead');
          setStatus('🏁 loop exited — SERVER DEAD', 'err');
          log('🪦 Correct fix: match on error, and `continue` on recoverable errors!', 'l-dim');
          $('#play').disabled = false;
          return;
        }

        const t = document.createElement('div');
        t.className = 'task';
        t.innerHTML = `<span><b>🔌 socket ${i}</b> <span style="color:#7d8590;">· TcpStream</span></span>
                       <span style="color:#7d8590;">127.0.0.1:${40000 + i}</span>`;
        $('#pool').appendChild(t);
        await fly($('#listener'), t, 'Ok', '#51cf66');
        t.classList.add('in');

        setStatus(`✅ Ok → spawned task ${i}`, 'ok');
        log(`   tokio::spawn(handler(socket)) → task ${i} active`, 'l-ok');
        $('#listener').classList.remove('active');
        await wait(500);
        setStatus('⏸ looping back to accept()');
        await wait(300);
      }

      log('🎧 All connections accepted and handled successfully!', 'l-ok');
      $('#play').disabled = false;
    }

    $('#play').addEventListener('click', run);
  </script>
</body>
</html>
