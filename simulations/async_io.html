<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Async I/O — 1 Worker Thread, 16 Sockets Multiplexing</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --line: #30363d;
      --text: #e6edf3;
      --text-muted: #7d8590;
      --thread: #4dabf7;
      --sock: #9775fa;
      --park: #6c757d;
      --ready: #51cf66;
      --wake: #ffd43b;
      --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 1.6;
      padding: 24px;
      max-width: 900px;
      margin: 0 auto;
    }

    /* NAVIGATION */
    .nav-bar {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 16px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-link {
      color: #58a6ff;
      text-decoration: none;
      font-weight: 600;
      font-size: 13px;
    }

    .nav-link:hover { text-decoration: underline; }

    .nav-badge {
      font-size: 11px;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.05);
      padding: 2px 8px;
      border-radius: 6px;
      border: 1px solid var(--line);
    }

    h1 {
      font-size: 16px;
      color: var(--text);
      font-weight: 600;
      margin-bottom: 14px;
    }

    .controls-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    button {
      background: #238636;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      padding: 8px 16px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }

    button:hover:not(:disabled) { background: #2ea043; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    button.btn-secondary {
      background: #21262d;
      border-color: var(--line);
      color: var(--text);
    }

    #stage {
      position: relative;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 22px;
      min-height: 380px;
    }

    .center {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    #thread {
      border: 3px solid var(--thread);
      color: var(--thread);
      border-radius: 12px;
      padding: 12px 24px;
      font-weight: 700;
      text-align: center;
      transition: all 0.3s;
      background: #0d1117;
    }

    #thread.busy {
      box-shadow: 0 0 30px -4px var(--thread);
      transform: scale(1.05);
    }

    #thread.idle {
      border-color: var(--park);
      color: var(--park);
      opacity: 0.55;
    }

    #reactor {
      border: 2px dashed var(--wake);
      color: var(--wake);
      border-radius: 10px;
      padding: 8px 18px;
      font-size: 12px;
      background: #0d1117;
      transition: all 0.3s;
    }

    #reactor.fire {
      background: #3d2a00;
      box-shadow: 0 0 22px -4px var(--wake);
    }

    #sockets {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 8px;
    }

    @media (max-width: 650px) {
      #sockets { grid-template-columns: repeat(4, 1fr); }
    }

    .sk {
      border: 2px solid var(--sock);
      border-radius: 8px;
      padding: 8px 6px;
      text-align: center;
      font-size: 11px;
      background: #0d1117;
      transition: all 0.3s;
    }

    .sk .id { font-weight: 700; color: var(--sock); }
    .sk .state { font-size: 9px; color: var(--text-muted); margin-top: 4px; }

    .sk.parked { border-color: var(--park); opacity: 0.5; }
    .sk.parked .id { color: var(--park); }

    .sk.ready {
      border-color: var(--ready);
      box-shadow: 0 0 16px -3px var(--ready);
      background: #0f2e1a;
      transform: scale(1.05);
    }
    .sk.ready .id { color: var(--ready); }

    #log {
      margin-top: 16px;
      background: #010409;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px;
      height: 160px;
      overflow-y: auto;
      font-size: 11px;
    }

    #log div {
      padding: 2px 0;
      border-bottom: 1px solid #161b22;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateX(-6px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .lv-ok { color: var(--ready); }
    .lv-park { color: var(--park); }
    .lv-wake { color: var(--wake); }
    .lv-dim { color: var(--text-muted); }
  </style>
</head>
<body>

  <!-- NAVIGATION -->
  <div class="nav-bar">
    <a href="../index.html" class="nav-link">← Back to Tokio Runtime Studio (index.html)</a>
    <span class="nav-badge">Module 02 · Reactor & epoll</span>
  </div>

  <!-- TITLE & CONTROLS -->
  <h1>One Worker Thread · One epoll Reactor · 16 Parked Sockets</h1>
  <div class="controls-row">
    <button id="play">▶ Run Reactor Multiplex</button>
    <button class="btn-secondary" onclick="location.reload()">🔄 Reset</button>
  </div>

  <!-- STAGE -->
  <div id="stage">
    <div class="center">
      <div id="thread">🧵 Worker Thread</div>
      <div id="reactor">⚛️ Reactor · epoll_wait()</div>
    </div>
    <div id="sockets"></div>
  </div>

  <!-- TELEMETRY LOG -->
  <div id="log"></div>

  <script>
    const $ = s => document.querySelector(s);
    const logEl = $('#log');
    const sockets = $('#sockets');
    const wait = ms => new Promise(r => setTimeout(r, ms));

    function log(m, c = '') {
      const d = document.createElement('div');
      d.className = c;
      d.textContent = m;
      logEl.appendChild(d);
      logEl.scrollTop = logEl.scrollHeight;
    }

    // Build socket cards
    for (let i = 1; i <= 16; i++) {
      const s = document.createElement('div');
      s.className = 'sk';
      s.id = 'sk' + i;
      s.innerHTML = `<div class="id">🔌 ${i}</div><div class="state">idle</div>`;
      sockets.appendChild(s);
    }

    async function run() {
      $('#play').disabled = true;
      logEl.innerHTML = '';
      document.querySelectorAll('.sk').forEach(s => {
        s.className = 'sk';
        s.querySelector('.state').textContent = 'idle';
      });
      $('#thread').className = '';
      $('#reactor').className = '';
      $('#thread').textContent = '🧵 Worker Thread';

      log('🔌 16 clients connect · 16 tasks spawned on runtime', 'lv-dim');
      await wait(400);

      $('#thread').textContent = '🧵 Worker · Running 16 tasks';
      for (let i = 1; i <= 16; i++) {
        await wait(50);
        log(`   task ${i}: socket.read(&mut buf).await → Poll::Pending 🛑`, 'lv-park');
        const s = $('#sk' + i);
        s.classList.add('parked');
        s.querySelector('.state').textContent = 'parked';
      }
      await wait(400);

      log('😴 All 16 sockets parked · Worker thread fully FREE 💤', 'lv-park');
      $('#thread').classList.add('idle');
      $('#thread').textContent = '🧵 Worker · Idle 💤';
      await wait(600);

      log('⚛️ Reactor: epoll_wait() active in background', 'lv-wake');
      $('#reactor').classList.add('fire');
      await wait(600);
      $('#reactor').classList.remove('fire');

      const arrivals = [3, 7, 11, 14];
      for (const n of arrivals) {
        log(`⚛️ Reactor: fd ${n} readable! → waker.wake()`, 'lv-wake');
        $('#reactor').classList.add('fire');
        const s = $('#sk' + n);
        s.classList.remove('parked');
        s.classList.add('ready');
        s.querySelector('.state').textContent = 'data!';
        await wait(200);
        $('#reactor').classList.remove('fire');

        $('#thread').classList.remove('idle');
        $('#thread').classList.add('busy');
        $('#thread').textContent = `🧵 Worker · Polling task ${n}`;
        log(`   ▶ Worker thread schedules task ${n} ONLY`, 'lv-ok');
        await wait(350);

        log(`   task ${n}: read → Ok(n), write_all → echo ✅`, 'lv-ok');
        s.classList.remove('ready');
        s.querySelector('.state').textContent = 'parked';
        await wait(150);
        s.classList.add('parked');

        $('#thread').classList.remove('busy');
        $('#thread').classList.add('idle');
        $('#thread').textContent = '🧵 Worker · Idle 💤';
        await wait(250);
      }

      log('✅ 16 sockets multiplexed by ONE worker thread without blocking!', 'lv-ok');
      $('#thread').classList.remove('idle');
      $('#thread').textContent = '🧵 Worker Thread';
      $('#play').disabled = false;
    }

    $('#play').addEventListener('click', run);
  </script>
</body>
</html>
