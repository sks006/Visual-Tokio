<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tokio::select! — Race & Cancellation by Drop</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --line: #30363d;
      --text: #e6edf3;
      --text-muted: #7d8590;
      --win: #51cf66;
      --lose: #ff6b6b;
      --db: #4dabf7;
      --timer: #ffd43b;
      --pend: #ffa94d;
      --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 1.6;
      padding: 24px;
      max-width: 900px;
      margin: 0 auto;
    }

    /* TOP NAVIGATION */
    .nav-bar {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 16px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-link {
      color: #58a6ff;
      text-decoration: none;
      font-weight: 600;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s;
    }

    .nav-link:hover {
      text-decoration: underline;
    }

    .nav-badge {
      font-size: 11px;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.05);
      padding: 2px 8px;
      border-radius: 6px;
      border: 1px solid var(--line);
    }

    /* HEADER & CONTROLS */
    h1 {
      font-size: 16px;
      color: var(--text);
      font-weight: 600;
      margin-bottom: 14px;
      letter-spacing: 0.3px;
    }

    .controls-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    button {
      background: #238636;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      padding: 8px 16px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }

    button:hover:not(:disabled) {
      background: #2ea043;
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    button.btn-secondary {
      background: #21262d;
      border-color: var(--line);
      color: var(--text);
    }

    button.btn-secondary:hover {
      background: #30363d;
    }

    label {
      font-size: 12px;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* STAGE */
    #stage {
      position: relative;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 22px;
      min-height: 280px;
    }

    .branch {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 14px;
      border: 2px solid var(--line);
      border-radius: 10px;
      padding: 14px;
      transition: all 0.35s ease;
      background: #0d1117;
    }

    .branch.db { border-color: var(--db); }
    .branch.timer { border-color: var(--timer); }

    .branch.win {
      border-color: var(--win);
      box-shadow: 0 0 22px -4px var(--win);
      background: #0f2e1a;
    }

    .branch.lose {
      border-color: var(--lose);
      opacity: 0.35;
      background: #2a0f0f;
    }

    .name {
      width: 140px;
      font-weight: 700;
    }

    .name.db { color: var(--db); }
    .name.timer { color: var(--timer); }

    .bar {
      flex: 1;
      height: 22px;
      background: #21262d;
      border-radius: 6px;
      overflow: hidden;
    }

    .bar > div {
      height: 100%;
      width: 0%;
      transition: width 0.25s linear;
    }

    .bar.db > div { background: var(--db); }
    .bar.timer > div { background: var(--timer); }

    .status {
      width: 130px;
      font-size: 11px;
      text-align: right;
      color: var(--text-muted);
    }

    .status.pend { color: var(--pend); }
    .status.win { color: var(--win); font-weight: 700; }
    .status.lose { color: var(--lose); font-weight: 700; }

    /* TELEMETRY LOG */
    #log {
      margin-top: 16px;
      background: #010409;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px;
      height: 160px;
      overflow-y: auto;
      font-size: 11px;
    }

    #log div {
      padding: 2px 0;
      border-bottom: 1px solid #161b22;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateX(-6px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .lv-ok { color: var(--win); }
    .lv-err { color: var(--lose); }
    .lv-pend { color: var(--pend); }
    .lv-dim { color: var(--text-muted); }
  </style>
</head>
<body>

  <!-- NAVIGATION -->
  <div class="nav-bar">
    <a href="../index.html" class="nav-link">← Back to Tokio Runtime Studio (index.html)</a>
    <span class="nav-badge">Module 01 · Control Flow</span>
  </div>

  <!-- TITLE & CONTROLS -->
  <h1>tokio::select! { db.query() =&gt; … , sleep(5s) =&gt; … }</h1>
  
  <div class="controls-row">
    <button id="play">▶ Race Branches</button>
    <button class="btn-secondary" onclick="location.reload()">🔄 Reset</button>
    <label>
      <input type="checkbox" id="dbWins" checked> 
      DB responds fast (1.8s vs 5.0s timeout)
    </label>
  </div>

  <!-- STAGE -->
  <div id="stage">
    <div class="branch db" id="bDb">
      <div class="name db">🔵 db.query()</div>
      <div class="bar db"><div id="dbBar"></div></div>
      <div class="status pend" id="dbSt">pending</div>
    </div>
    <div class="branch timer" id="bTimer">
      <div class="name timer">🟡 sleep(5s)</div>
      <div class="bar timer"><div id="tBar"></div></div>
      <div class="status pend" id="tSt">pending</div>
    </div>
  </div>

  <!-- TELEMETRY LOG -->
  <div id="log"></div>

  <script>
    const $ = s => document.querySelector(s);
    const logEl = $('#log');
    const wait = ms => new Promise(r => setTimeout(r, ms));

    function log(m, c = '') {
      const d = document.createElement('div');
      d.className = c;
      d.textContent = m;
      logEl.appendChild(d);
      logEl.scrollTop = logEl.scrollHeight;
    }

    function setStatus(el, t, c) {
      el.textContent = t;
      el.className = 'status ' + c;
    }

    async function run() {
      $('#play').disabled = true;
      logEl.innerHTML = '';
      $('#bDb').className = 'branch db';
      $('#bTimer').className = 'branch timer';
      $('#dbBar').style.width = '0%';
      $('#tBar').style.width = '0%';
      setStatus($('#dbSt'), 'pending', 'pend');
      setStatus($('#tSt'), 'pending', 'pend');

      const dbFast = $('#dbWins').checked;
      const dbDur = dbFast ? 1800 : 99999;
      const timerDur = 5000;

      log('▶ entering select! — polling all branches concurrently', 'lv-dim');
      await wait(300);
      log('   db.query() → Poll::Pending 🛑 · registered waker with reactor', 'lv-pend');
      log('   sleep(5s)  → Poll::Pending 🛑 · registered waker with timer wheel', 'lv-pend');
      await wait(200);

      log('⏳ both branches racing…', 'lv-dim');
      const t0 = performance.now();
      let winner = null;

      while (!winner) {
        const el = performance.now() - t0;
        const dbPct = Math.min(100, (el / dbDur) * 100);
        const tPct  = Math.min(100, (el / timerDur) * 100);
        $('#dbBar').style.width = dbPct + '%';
        $('#tBar').style.width = tPct + '%';
        if (dbPct >= 100 && winner === null) winner = 'db';
        if (tPct >= 100 && winner === null) winner = 'timer';
        await wait(40);
      }

      if (winner === 'db') {
        $('#bDb').classList.add('win');
        setStatus($('#dbSt'), '✅ Ready', 'win');
        $('#bTimer').classList.add('lose');
        setStatus($('#tSt'), '❌ dropped', 'lose');
        log('🔵 db.query() returned Ready ✅', 'lv-ok');
        log('   select! runs its arm', 'lv-ok');
        log('   🧹 sleep(5s) future DROPPED — cancelled in timer wheel without leak', 'lv-dim');
        log('✅ Got result in ~1.8s, runtime saved 3.2s', 'lv-ok');
      } else {
        $('#bTimer').classList.add('win');
        setStatus($('#tSt'), '✅ Ready', 'win');
        $('#bDb').classList.add('lose');
        setStatus($('#dbSt'), '❌ dropped', 'lose');
        log('🟡 sleep(5s) fired first ✅', 'lv-ok');
        log('   select! runs the timeout arm', 'lv-ok');
        log('   🧹 db.query() future DROPPED — TCP socket closed, buffers freed', 'lv-err');
        log('⏰ TIMEOUT — but the worker runtime is NOT stuck', 'lv-ok');
      }

      $('#play').disabled = false;
    }

    $('#play').addEventListener('click', run);
  </script>
</body>
</html>
